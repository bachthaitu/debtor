<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF9F5" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#191817" media="(prefers-color-scheme:dark)">
<title>Debtor — Quản lý cho vay</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' font-family='Georgia' font-style='italic' fill='%23D97352'>D</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <nav class="nav" id="sidebarNav"></nav>
    <div class="sidebar-foot">
      <button class="nav-item" data-action="theme-toggle" type="button">
        <span class="nav-icon" data-icon="theme"></span>
        <span class="nav-label" data-theme-label>Giao diện sáng</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn mobile-only" id="backBtn" data-action="back" type="button" hidden></button>
        <h1 class="page-title" id="pageTitle">Tổng quan</h1>
      </div>
      <div class="topbar-right" id="topbarActions"></div>
    </header>
    <div class="view" id="view"></div>
  </main>

  <nav class="tabbar" id="tabbar"></nav>

  <button class="fab" id="fab" aria-label="Cho vay mới" type="button">
    <span data-icon="plus"></span>
  </button>
</div>

<div class="toast-stack" id="toastStack"></div>
<div class="modal-root" id="modalRoot"></div>

<script src="app.js"></script>
</body>
</html>
