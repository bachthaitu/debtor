<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme:dark)">
<title>Debtor Management</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <nav class="nav" id="sidebarNav"></nav>
    <div class="sidebar-foot">
      <button class="nav-item" data-action="theme-toggle" type="button">
        <span class="nav-icon" data-theme-icon></span>
        <span class="nav-label" data-theme-label>Chế độ sáng</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="back-btn" id="backBtn" type="button" hidden aria-label="Quay lại">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <h1 class="page-title" id="pageTitle">Tổng quan</h1>
      <div class="topbar-actions" id="topbarActions"></div>
    </header>
    <div class="view" id="view"></div>
  </main>

  <nav class="tabbar" id="tabbar"></nav>

  <button class="fab" id="fab" type="button" aria-label="Cho vay mới">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
  </button>
</div>

<div class="toast-stack" id="toastStack"></div>
<div class="modal-root" id="modalRoot"></div>

<script src="app.js"></script>
</body>
</html>
